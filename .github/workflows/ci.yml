name: Stellar Splash Contracts CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test, Lint and Build Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Run Test Suite
        run: cargo test --lib --verbose

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Optimized WASM Target
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Verify WASM Binary Output
        run: ls -la target/wasm32-unknown-unknown/release/*.wasm

      - name: Upload Contract WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-splash-vault-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7
