name: Basis Points Fuzzing Harness

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  fuzz:
    name: Run Fuzzing Simulations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Basis Points Conservation Fuzzer
        run: node scripts/fuzz-basis-points.cjs

